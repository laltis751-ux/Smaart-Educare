name: Build Smaart Educare APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-app extracted
          mkdir -p extracted android-app

          unzip -q SmaartEducareAndroidProject_v1.1.zip -d extracted

          PROJECT_ROOT=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android Gradle project not found in ZIP"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Android project found at: $PROJECT_ROOT"
          cp -r "$PROJECT_ROOT"/. android-app/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smaart-Educare-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
